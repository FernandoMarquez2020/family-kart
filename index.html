<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Family Kart</title>
    <meta
      name="description"
      content="Carreras de kart con toda la familia: seis pilotos, seis pistas y partidas online para correr entre casas."
    />

    <!-- Ícono de la aplicación: la pestaña, el acceso directo del escritorio y
         la pantalla de inicio del celular. Los tres salen del mismo dibujo, que
         genera `scripts/build-icons.py`. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icono-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-title" content="Family Kart" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Lo que se ve cuando alguien pasa el link por WhatsApp.
         Las direcciones van completas y no relativas a propósito: el que arma la
         vista previa es un servidor de WhatsApp, no el navegador de nadie, y una
         dirección relativa la resuelve contra sí mismo y no encuentra nada. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Family Kart" />
    <meta property="og:title" content="Family Kart — ¡te invitaron a correr!" />
    <meta
      property="og:description"
      content="Entrá a la sala, elegí tu personaje y corré con la familia desde donde estés."
    />
    <meta property="og:url" content="https://fernandomarquez2020.github.io/family-kart/" />
    <meta
      property="og:image"
      content="https://fernandomarquez2020.github.io/family-kart/invitacion.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cuatro karts cruzando la línea de largada" />
    <meta property="og:locale" content="es_UY" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="hud" class="hidden">
        <div class="hud-topleft">
          <div class="stat-box" id="hud-position-box">
            <span class="stat-label">PUESTO</span>
            <span class="stat-value"
              ><span id="hud-position">1</span><span class="stat-total" id="hud-position-total">/4</span></span
            >
          </div>
          <div class="stat-box">
            <span class="stat-label">VUELTA</span>
            <span class="stat-value"
              ><span id="hud-lap">1</span><span class="stat-total" id="hud-lap-total">/3</span></span
            >
          </div>
          <div class="time-box">
            <div class="time-row"><span>TIEMPO</span><b id="hud-time">0:00.00</b></div>
            <div class="time-row dim"><span>MEJOR</span><b id="hud-best">--:--.--</b></div>
            <div class="time-row dim"><span>&Uacute;LTIMA</span><b id="hud-last">--:--.--</b></div>
          </div>
        </div>

        <div class="hud-topright">
          <div id="hud-item" class="item-slot"><span id="hud-item-icon"></span></div>
          <div id="hud-map-box" class="map-box"><canvas id="hud-map"></canvas></div>
        </div>

        <div class="hud-bottomright">
          <div class="speedo"><span id="hud-speed">0</span><small>km/h</small></div>
          <div class="drift-bar"><div id="hud-drift-fill"></div></div>
        </div>

        <div id="hud-center-msg"></div>
        <div id="hud-warning" class="hidden">&iexcl;CONTRAMANO!</div>
      </div>

      <div id="menu">
        <div class="menu-panel">
          <header class="menu-head">
            <h1>FAMILY <span>KART</span></h1>
            <p class="tagline" id="menu-step-label">Eleg&iacute; c&oacute;mo quer&eacute;s jugar.</p>
          </header>

          <div id="menu-body"></div>

          <div class="menu-nav">
            <button id="menu-back" class="ghost-btn" type="button">&larr; Atr&aacute;s</button>
            <button id="menu-next" class="primary-btn" type="button">SIGUIENTE</button>
          </div>

          <div class="controls">
            <div><kbd>&uarr;</kbd> acelerar</div>
            <div><kbd>&darr;</kbd> frenar / reversa</div>
            <div><kbd>&larr;</kbd> <kbd>&rarr;</kbd> doblar</div>
            <div><kbd>Espacio</kbd> saltar y derrapar</div>
            <div><kbd>Shift</kbd> usar el poder</div>
            <div><kbd>R</kbd> volver a la pista</div>
          </div>
        </div>
      </div>

      <div id="results" class="hidden">
        <div class="results-panel">
          <h2 id="results-title">Resultados</h2>
          <p id="results-subtitle" class="tagline"></p>
          <div id="results-table" class="results-table"></div>
          <div class="results-actions">
            <button id="results-primary" class="primary-btn" type="button">CONTINUAR</button>
            <button id="results-menu" class="ghost-btn" type="button">Men&uacute;</button>
          </div>
        </div>
      </div>

      <button id="back-btn" class="hidden" type="button">&larr; Salir</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
